<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pharmacy POS Offline Prototype</title>
<style>
:root{--navy:#12304a;--blue:#2563eb;--bg:#f4f7fb;--card:#fff;--text:#1f2937;--muted:#64748b;--danger:#b91c1c;--ok:#15803d;--border:#dbe3ee}*{box-sizing:border-box}body{margin:0;font:14px system-ui,Segoe UI,sans-serif;color:var(--text);background:var(--bg)}button,input,select{font:inherit}button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;background:var(--blue);color:white;font-weight:600}button.secondary{background:#e8eef7;color:var(--navy)}button.danger{background:#b91c1c}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#12304a,#2563eb)}.login-card{background:#fff;padding:32px;border-radius:16px;width:min(420px,92vw);box-shadow:0 20px 60px #0b244544}.login-card h1{margin:0 0 6px;color:var(--navy)}.login-card p{color:var(--muted)}label{display:block;margin:14px 0 6px;font-weight:600}input,select{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:white}.hint{font-size:12px;color:var(--muted);margin-top:14px}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.sidebar{background:var(--navy);color:#dbeafe;padding:20px}.brand{font-size:20px;font-weight:800;color:white;margin-bottom:24px}.user{font-size:12px;color:#9fb4cc;border-bottom:1px solid #ffffff22;padding-bottom:16px;margin-bottom:14px}.nav button{width:100%;text-align:left;background:transparent;color:#dbeafe;margin:3px 0}.nav button:hover,.nav button.active{background:#ffffff18}.main{padding:24px;max-width:1500px;width:100%;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.topbar h2{margin:0;color:var(--navy)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:0 4px 15px #183b5a08}.metric{font-size:26px;font-weight:800;color:var(--navy);margin-top:8px}.muted{color:var(--muted)}.section{margin-top:20px}.section h3{margin:0 0 12px;color:var(--navy)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{max-width:420px}.table-wrap{overflow:auto;background:white;border:1px solid var(--border);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--border)}th{background:#eef4fb;color:var(--navy);font-size:12px;text-transform:uppercase}tr:last-child td{border-bottom:0}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8eef7;color:var(--navy);font-size:12px}.pill.danger{background:#fee2e2;color:var(--danger)}.pill.ok{background:#dcfce7;color:var(--ok)}.pos{display:grid;grid-template-columns:1fr 360px;gap:18px}.cart-total{font-size:30px;font-weight:800;color:var(--navy);margin:12px 0}.empty{padding:30px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:20px;right:20px;background:#12304a;color:#fff;padding:12px 16px;border-radius:8px;display:none;z-index:5}.danger-text{color:var(--danger);font-weight:700}@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{position:static}.nav{display:flex;flex-wrap:wrap;gap:4px}.nav button{width:auto}.grid{grid-template-columns:repeat(2,1fr)}.pos{grid-template-columns:1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="login"><div class="login-card"><h1>Pharmacy POS</h1><p>Offline-first prototype</p><label>Username</label><input id="username" value="admin"><label>Password</label><input id="password" type="password" value="admin"><button style="width:100%;margin-top:18px" onclick="login()">Sign in</button><div class="hint">Demo accounts: <b>admin/admin</b> or <b>cashier/cashier</b></div></div></div>
<div id="app" class="shell hidden"><aside class="sidebar"><div class="brand">Pharmacy POS</div><div class="user" id="userInfo"></div><div class="nav"><button data-page="dashboard" onclick="showPage('dashboard')">Dashboard</button><button data-page="pos" onclick="showPage('pos')">New Bill</button><button data-page="medicines" onclick="showPage('medicines')">Medicines & Stock</button><button data-page="alerts" onclick="showPage('alerts')">Alerts</button><button data-page="reports" onclick="showPage('reports')">Reports</button><button data-page="backup" onclick="showPage('backup')">Backup</button><button class="secondary" onclick="logout()">Sign out</button></div></aside><main class="main"><div class="topbar"><h2 id="pageTitle">Dashboard</h2><span class="pill" id="modePill">Offline mode</span></div><div id="content"></div></main></div><div id="toast" class="toast"></div>
<script>
const seed=[
{id:1,name:'Paracetamol 500mg',formula:'Paracetamol',company:'Acme Pharma',barcode:'890100000001',batch:'PCM-2401',expiry:'2027-06-30',purchase:1.2,mrp:2.5,price:2.2,stock:120,reorder:20},
{id:2,name:'Amoxicillin 500mg',formula:'Amoxicillin',company:'Health Labs',barcode:'890100000002',batch:'AMX-2403',expiry:'2026-12-15',purchase:3.1,mrp:5.5,price:5,stock:18,reorder:25},
{id:3,name:'Cetirizine 10mg',formula:'Cetirizine',company:'Acme Pharma',barcode:'890100000003',batch:'CET-2402',expiry:'2026-10-10',purchase:.8,mrp:1.8,price:1.5,stock:7,reorder:15},
{id:4,name:'Vitamin C Tablets',formula:'Ascorbic Acid',company:'Wellness Co',barcode:'890100000004',batch:'VTC-2401',expiry:'2028-03-20',purchase:2,mrp:4,price:3.5,stock:50,reorder:10}];
let db=JSON.parse(localStorage.getItem('pharmacyDB')||'null')||{medicines:seed,sales:[],nextInvoice:1};let currentUser=null,cart=[];
const save=()=>localStorage.setItem('pharmacyDB',JSON.stringify(db)); const money=n=>'$'+Number(n||0).toFixed(2); const today=()=>new Date().toISOString().slice(0,10); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){let t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}
function login(){let u=document.getElementById('username').value.trim(),p=document.getElementById('password').value; if((u==='admin'&&p==='admin')||(u==='cashier'&&p==='cashier')){currentUser={name:u,role:u==='admin'?'ADMIN':'CASHIER'};document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('userInfo').textContent=u+' • '+currentUser.role;showPage('dashboard')}else toast('Invalid demo credentials')}
function logout(){currentUser=null;document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
function showPage(page){document.querySelectorAll('.nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('pageTitle').textContent={dashboard:'Dashboard',pos:'New Bill',medicines:'Medicines & Stock',alerts:'Alerts',reports:'Reports',backup:'Backup & Data'}[page];({dashboard:renderDashboard,pos:renderPOS,medicines:renderMedicines,alerts:renderAlerts,reports:renderReports,backup:renderBackup}[page])()}
function renderDashboard(){let sales=db.sales.filter(s=>s.date===today()),revenue=sales.reduce((a,s)=>a+s.total,0),low=db.medicines.filter(m=>m.stock<=m.reorder).length,exp=db.medicines.filter(m=>new Date(m.expiry)<=new Date(Date.now()+90*864e5)).length;document.getElementById('content').innerHTML=`<div class="grid"><div class="card"><div class="muted">Today's sales</div><div class="metric">${money(revenue)}</div></div><div class="card"><div class="muted">Bills today</div><div class="metric">${sales.length}</div></div><div class="card"><div class="muted">Low stock</div><div class="metric">${low}</div></div><div class="card"><div class="muted">Expiry ≤ 90 days</div><div class="metric">${exp}</div></div></div><div class="section card"><h3>Quick actions</h3><div class="toolbar"><button onclick="showPage('pos')">New Bill</button><button class="secondary" onclick="showPage('medicines')">View Stock</button><button class="secondary" onclick="showPage('reports')">Sales Report</button><button class="secondary" onclick="showPage('backup')">Backup Now</button></div><p class="muted">This prototype stores data in this browser's local storage and continues working without internet.</p></div>`}
function renderPOS(){cart=[];document.getElementById('content').innerHTML=`<div class="pos"><div><div class="toolbar"><input id="scan" autofocus placeholder="Scan barcode or search medicine" onkeydown="if(event.key==='Enter')addBySearch()"><button onclick="addBySearch()">Add item</button></div><div class="table-wrap"><table><thead><tr><th>Medicine / batch</th><th>Expiry</th><th>Qty</th><th>Price</th><th>Total</th><th></th></tr></thead><tbody id="cartBody"><tr><td colspan="6" class="empty">Scan or search a medicine to begin.</td></tr></tbody></table></div></div><div class="card"><h3>Payment</h3><div class="muted">Subtotal</div><div id="subtotal" class="cart-total">$0.00</div><label>Bill discount</label><input id="billDiscount" type="number" min="0" value="0" oninput="renderCart()"><label>Payment method</label><select id="payment"><option>CASH</option><option>CARD</option><option>UPI</option><option>CREDIT</option></select><label>Amount received</label><input id="received" type="number" min="0" value="0" oninput="renderCart()"><div id="change" class="muted" style="margin:12px 0">Change: $0.00</div><button style="width:100%" onclick="completeSale()">Complete sale & print</button></div></div>`}
function addBySearch(){let q=document.getElementById('scan').value.trim().toLowerCase();if(!q)return;let m=db.medicines.find(x=>x.barcode.toLowerCase()===q||x.name.toLowerCase().includes(q)||x.formula.toLowerCase().includes(q)||x.company.toLowerCase().includes(q));if(!m){toast('Medicine not found');return}if(m.stock<1){toast('Out of stock');return}let line=cart.find(x=>x.id===m.id);if(line){if(line.qty<m.stock)line.qty++;else toast('Insufficient stock')}else cart.push({...m,qty:1});document.getElementById('scan').value='';renderCart()}
function renderCart(){let body=document.getElementById('cartBody');if(!body)return;if(!cart.length){body.innerHTML='<tr><td colspan="6" class="empty">Scan or search a medicine to begin.</td></tr>'}else body.innerHTML=cart.map((m,i)=>`<tr><td><b>${esc(m.name)}</b><br><span class="muted">${esc(m.batch)}</span></td><td>${esc(m.expiry)}</td><td><input style="width:70px" type="number" min="1" max="${m.stock}" value="${m.qty}" onchange="setQty(${i},this.value)"></td><td>${money(m.price)}</td><td>${money(m.price*m.qty)}</td><td><button class="danger" onclick="cart.splice(${i},1);renderCart()">×</button></td></tr>`).join('');let sub=cart.reduce((a,m)=>a+m.price*m.qty,0),disc=Number(document.getElementById('billDiscount')?.value||0),total=Math.max(0,sub-disc),rec=Number(document.getElementById('received')?.value||0);if(document.getElementById('subtotal'))document.getElementById('subtotal').textContent=money(total);if(document.getElementById('change'))document.getElementById('change').textContent=(rec>=total?'Change: ':'Outstanding: ')+money(Math.abs(rec-total))}
function setQty(i,v){let n=Math.max(1,Math.min(Number(v)||1,cart[i].stock));cart[i].qty=n;renderCart()}
function completeSale(){if(!cart.length){toast('Add at least one item');return}let sub=cart.reduce((a,m)=>a+m.price*m.qty,0),disc=Number(document.getElementById('billDiscount').value||0),total=Math.max(0,sub-disc),method=document.getElementById('payment').value,rec=Number(document.getElementById('received').value||0);if(method!=='CREDIT'&&rec<total){toast('Amount received is less than total');return}cart.forEach(m=>{let x=db.medicines.find(y=>y.id===m.id);x.stock-=m.qty});let sale={invoice:'INV-'+String(db.nextInvoice++).padStart(5,'0'),date:today(),time:new Date().toLocaleTimeString(),items:cart.map(m=>({name:m.name,qty:m.qty,price:m.price})),subtotal:sub,discount:disc,total,payment:method};db.sales.push(sale);save();printReceipt(sale);cart=[];renderPOS();toast('Sale completed: '+sale.invoice)}
function printReceipt(s){let w=window.open('','_blank','width=360,height=600');if(!w){toast('Allow popups to print');return}w.document.write(`<pre style="font:14px monospace">PHARMACY POS\nInvoice: ${s.invoice}\n${s.date} ${s.time}\n------------------------------\n${s.items.map(i=>`${i.name.slice(0,20).padEnd(20)} ${i.qty} x ${money(i.price)}\n`).join('')}------------------------------\nSubtotal: ${money(s.subtotal)}\nDiscount: ${money(s.discount)}\nTOTAL:    ${money(s.total)}\nPaid by:  ${s.payment}\n\nThank you</pre><script>window.print()<\/script>`);w.document.close()}
function renderMedicines(){document.getElementById('content').innerHTML=`<div class="toolbar"><input id="medSearch" placeholder="Search name, company, formula, barcode" oninput="filterMedicines()"><button class="secondary" onclick="addMedicine()">Add demo medicine</button></div><div class="table-wrap"><table><thead><tr><th>Medicine</th><th>Company / formula</th><th>Barcode</th><th>Batch</th><th>Expiry</th><th>MRP</th><th>Stock</th><th>Status</th></tr></thead><tbody id="medBody"></tbody></table></div>`;filterMedicines()}
function filterMedicines(){let q=(document.getElementById('medSearch')?.value||'').toLowerCase(),rows=db.medicines.filter(m=>[m.name,m.company,m.formula,m.barcode,m.batch].some(v=>String(v).toLowerCase().includes(q)));document.getElementById('medBody').innerHTML=rows.map(m=>`<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.company)}<br><span class="muted">${esc(m.formula)}</span></td><td>${esc(m.barcode)}</td><td>${esc(m.batch)}</td><td class="${new Date(m.expiry)<new Date()?'danger-text':''}">${m.expiry}</td><td>${money(m.mrp)}</td><td>${m.stock}</td><td>${m.stock<=m.reorder?'<span class="pill danger">Low stock</span>':'<span class="pill ok">OK</span>'}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No medicines found.</td></tr>'}
function addMedicine(){let id=Date.now();db.medicines.push({id,name:'New Medicine',formula:'Formula',company:'Supplier',barcode:String(id),batch:'NEW-001',expiry:'2028-12-31',purchase:1,mrp:2,price:1.8,stock:10,reorder:5});save();filterMedicines();toast('Demo medicine added; edit production data through the full admin form.')}
function renderAlerts(){let now=Date.now(),rows=db.medicines.filter(m=>m.stock<=m.reorder||new Date(m.expiry).getTime()<=now+90*864e5);document.getElementById('content').innerHTML=`<div class="card"><h3>Low stock and expiry alerts</h3><p class="muted">Expiry buckets: expired, 30, 60, and 90 days. Prototype uses the device date.</p><div class="table-wrap"><table><thead><tr><th>Medicine</th><th>Batch</th><th>Stock</th><th>Expiry</th><th>Alert</th></tr></thead><tbody>${rows.map(m=>{let days=Math.ceil((new Date(m.expiry)-new Date())/864e5),a=[];if(m.stock<=m.reorder)a.push('Low stock');if(days<0)a.push('Expired');else if(days<=30)a.push('≤30 days');else if(days<=60)a.push('≤60 days');else if(days<=90)a.push('≤90 days');return `<tr><td>${esc(m.name)}</td><td>${esc(m.batch)}</td><td>${m.stock}</td><td>${m.expiry}</td><td><span class="pill danger">${a.join(' / ')}</span></td></tr>`}).join('')||'<tr><td colspan="5" class="empty">No active alerts.</td></tr>'}</tbody></table></div></div>`}
function renderReports(){let sales=db.sales,rev=sales.reduce((a,s)=>a+s.total,0),profit=sales.reduce((a,s)=>a+s.items.reduce((x,i)=>{let m=db.medicines.find(z=>z.name===i.name);return x+(i.price-(m?.purchase||0))*i.qty},0),0);document.getElementById('content').innerHTML=`<div class="grid"><div class="card"><div class="muted">All-time sales</div><div class="metric">${money(rev)}</div></div><div class="card"><div class="muted">Estimated gross profit</div><div class="metric">${money(profit)}</div></div><div class="card"><div class="muted">Invoices</div><div class="metric">${sales.length}</div></div><div class="card"><div class="muted">Inventory value at price</div><div class="metric">${money(db.medicines.reduce((a,m)=>a+m.stock*m.purchase,0))}</div></div></div><div class="section card"><h3>Sales register</h3><div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Date</th><th>Items</th><th>Payment</th><th>Total</th></tr></thead><tbody>${sales.slice().reverse().map(s=>`<tr><td>${s.invoice}</td><td>${s.date} ${s.time}</td><td>${s.items.map(i=>i.name+' × '+i.qty).join(', ')}</td><td>${s.payment}</td><td>${money(s.total)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No sales yet.</td></tr>'}</tbody></table></div></div>`}
function renderBackup(){document.getElementById('content').innerHTML=`<div class="card"><h3>Local backup</h3><p class="muted">Export the current local data as JSON. In production, replace this with encrypted, timestamped SQLite backups and restore validation.</p><div class="toolbar"><button onclick="downloadBackup()">Download backup</button><button class="secondary" onclick="resetDemo()">Reset demo data</button></div><p class="hint">Last browser save: ${localStorage.getItem('pharmacyDB')?'available':'not available'}</p></div>`}
function downloadBackup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='pharmacy-backup-'+today()+'.json';a.click();toast('Backup downloaded')}
function resetDemo(){if(currentUser.role!=='ADMIN'){toast('Admin only');return}if(confirm('Reset all local prototype data?')){db={medicines:seed,sales:[],nextInvoice:1};save();showPage('dashboard');toast('Demo data reset')}}
</script></body></html>
